name: Build Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4
        with:
          path: Elementwright-RPA-Studio

      - name: Checkout Framework
        uses: actions/checkout@v4
        with:
          repository: ilyali034/Elementwright-RPA-Framework
          ref: main
          path: Elementwright-RPA-Framework

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: Elementwright-RPA-Studio
        run: dotnet restore .\src\Elementwright.Studio\Elementwright.Studio.csproj

      - name: Build
        working-directory: Elementwright-RPA-Studio
        run: dotnet build .\src\Elementwright.Studio\Elementwright.Studio.csproj --no-restore --configuration Release
